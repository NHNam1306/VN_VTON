services:
  - type: web
    name: fitting-room
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: PERSISTENCE_BACKEND
        value: postgres
      - key: AUTH_BACKEND
        value: supabase
      - key: IMAGE_STORAGE
        value: r2
      - key: IMAGE_PROVIDER
        value: openrouter
      - key: OPENROUTER_IMAGE_MODEL
        value: black-forest-labs/flux-3-image-klein
      - key: OPENROUTER_IMAGE_RESOLUTION
        value: "768"
      - key: OPENROUTER_IMAGE_ASPECT_RATIO
        value: "4:5"
      - key: OPENROUTER_TIMEOUT_MS
        value: "120000"
      - key: AUTH_SESSION_DAYS
        value: "30"
      - key: AI_REQUESTS_PER_15_MIN
        value: "10"
      - key: R2_PREFIX
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
